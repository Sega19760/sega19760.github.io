<!DOCTYPE html>
<html>
<head>
  <title>We The Goobers Wiki</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* Basic, classic web typography */
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      
      /* The banner covers the entire screen background */
      background-color: #111;
      background-size: cover;
      background-position: center;
      background-attachment: fixed; 
      transition: background-image 0.5s ease-in-out; 
    }

    /* A semi-transparent overlay so we can actually read the text */
    .page-wrapper {
      background-color: rgba(0, 0, 0, 0.75);
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    /* Simple centered header */
    .header {
      text-align: center;
      padding: 20px 0;
      border-bottom: 2px solid #555;
      margin-bottom: 20px;
      max-width: 1000px;
      margin-left: auto;
      margin-right: auto;
    }

    .header h1 {
      margin: 0;
      font-size: 36px;
    }

    /* Standard classic layout */
    .container {
      display: flex;
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto; 
    }

    /* Simple sidebar box */
    .sidebar {
      width: 200px;
      background-color: rgba(30, 30, 30, 0.9);
      padding: 15px;
      border: 1px solid #666;
    }

    .sidebar h3 {
      margin-top: 0;
      border-bottom: 1px solid #444;
      padding-bottom: 5px;
    }

    /* Classic links */
    .sidebar a {
      display: block;
      color: #66b3ff;
      margin: 10px 0;
      text-decoration: underline; 
      cursor: pointer;
      font-size: 16px;
    }

    .sidebar a:hover {
      color: #ffffff;
      background-color: rgba(255, 255, 255, 0.1);
    }

    /* Simple content box */
    .content {
      flex: 1;
      background-color: rgba(40, 40, 40, 0.9);
      padding: 20px;
      border: 1px solid #666;
      transition: background-color 0.4s; 
    }

    .content h2 {
      margin-top: 0;
      border-bottom: 1px dashed #777;
      padding-bottom: 10px;
    }

    #article {
      line-height: 1.5;
    }

    /* --- WIKI IMAGE STYLING --- */
    
    /* Clearfix: ensures the article box stretches down if the floated image is really tall */
    #article::after {
      content: "";
      display: table;
      clear: both;
    }

    /* Default style for portrait or normal images */
    #article img {
      max-width: 100%;
      height: auto;
      border: 2px solid #fff; 
      margin: 15px 0;
      display: block;
    }

    /* Wiki-style right-floating for landscape images */
    #article img.wiki-landscape {
      float: right;
      max-width: 45%; /* Keeps it taking up roughly half the screen like Wikipedia */
      margin: 5px 0 15px 20px; /* Adds space on the left and bottom so text doesn't touch it */
    }

    /* Mobile view */
    @media (max-width: 700px) {
      .container {
        flex-direction: column;
      }
      .sidebar {
        width: auto; 
      }
      
      /* Stop floating images on phones so they don't squish the text */
      #article img.wiki-landscape {
        float: none;
        max-width: 100%;
        margin: 15px 0;
      }
    }
  </style>
</head>
<body>

<div class="page-wrapper">
  
  <div class="header">
    <h1 id="siteTitle">We The Goobers Wiki</h1>
  </div>

  <div class="container">
    
    <div class="sidebar" id="sidebar">
      <h3>Pages</h3>
      <!-- Links generated by JS -->
    </div>
    
    <div class="content" id="contentBox">
      <h2 id="pageTitle">Main Page</h2>
      <div id="article">Welcome to the wiki. Click a page on the left to start reading!</div>
    </div>

  </div>

</div>

<script>
  // Your page data
  const pages = {
    wtg_drama: { title: "Drama", file: "wtg_drama.txt", banner: "yourimage.png", color: "rgba(58, 26, 26, 0.9)" },
    issac: { title: "Issac get outta there", file: "issac.txt", banner: "image-3.png", color: "rgba(42, 13, 42, 0.9)" },
    ragebait_war: { title: "The Ragebait War", file: "ragebait_war.txt", banner: "nonelmfao.png", color: "rgba(38, 11, 64, 0.9)" },
    oofer: { title: "Oofer", file: "oofer.txt", banner: "image-2.png", color: "rgba(42, 13, 13, 0.9)" },
    pak_attak: { title: "pak_attak", file: "pak_attak.txt", banner: "IMG_8739.png", color: "rgba(20, 50, 50, 0.9)" },
    Tauntful: { title: "Tauntful", file: "alex.txt", banner: "rk.png", color: "rgba(1, 70, 25, 0.9)" },
    Mellody: { title: "Mellody", file: "mellody.txt", banner: "none", color: "rgba(60, 20, 90, 0.9)" },
    toby: { title: "Toby", file: "toby.txt", banner: "image.jpg", color: "rgba(13, 42, 42, 0.9)" }
  };

  const sidebar = document.getElementById("sidebar");
  const articleDiv = document.getElementById("article");
  const pageTitle = document.getElementById("pageTitle");
  const siteTitle = document.getElementById("siteTitle");
  const contentBox = document.getElementById("contentBox");

  Object.keys(pages).forEach(key => {
    const link = document.createElement("a");
    link.textContent = pages[key].title;
    link.onclick = () => loadPage(key);
    sidebar.appendChild(link);
  });

  function loadPage(key) {
    const page = pages[key];

    if (page.banner !== "none") {
      document.body.style.backgroundImage = `url("${page.banner}")`;
    } else {
      document.body.style.backgroundImage = `none`;
    }

    contentBox.style.backgroundColor = page.color;
    pageTitle.textContent = page.title;
    siteTitle.textContent = "We The Goobers Wiki - " + page.title;
    articleDiv.innerHTML = "<em>Loading content...</em>";

    fetch(page.file + "?v=" + Date.now())
      .then(res => {
        if (!res.ok) throw new Error("File missing");
        return res.text();
      })
      .then(text => {
        const formattedText = text.split('\n\n').map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');
        articleDiv.innerHTML = formattedText;

        // --- NEW: Detect Landscape Images and apply Wiki styling ---
        const images = articleDiv.querySelectorAll("img");
        images.forEach(img => {
          
          // Function to check if image is wider than it is tall
          const checkImageShape = () => {
            if (img.naturalWidth > img.naturalHeight) {
              img.classList.add("wiki-landscape");
            }
          };

          // Check if the browser already loaded it instantly, otherwise wait for it to load
          if (img.complete) {
            checkImageShape();
          } else {
            img.onload = checkImageShape;
          }
        });

      })
      .catch(() => {
        articleDiv.innerHTML = "<strong>Error:</strong> Page not found or couldn't load.";
      });
  }
</script>

</body>
</html>
