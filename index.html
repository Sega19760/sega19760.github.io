<!DOCTYPE html>
<html>
<head>
  <title>We The Goobers Wiki - Service Down</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      background-color: #111;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      transition: background-image 0.5s ease-in-out;
    }

    .page-wrapper {
      background-color: rgba(0, 0, 0, 0.75);
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    .down-strip {
      max-width: 1000px;
      margin: 0 auto 15px auto;
      background-color: #b30000;
      border: 2px solid #ff6666;
      padding: 8px 12px;
      font-weight: bold;
      text-align: center;
      letter-spacing: 1px;
      font-size: 14px;
      animation: strip-blink 1.6s steps(1) infinite;
    }
    @keyframes strip-blink {
      0%, 60% { background-color: #b30000; }
      61%, 100% { background-color: #7a0000; }
    }

    .header {
      text-align: center;
      padding: 20px 0;
      border-bottom: 2px solid #555;
      margin-bottom: 20px;
      max-width: 1000px;
      margin: 0 auto 20px auto;
    }

    .header h1 {
      margin: 0;
      font-size: 36px;
    }

    .container {
      display: flex;
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .sidebar {
      width: 200px;
      background-color: rgba(30, 30, 30, 0.9);
      padding: 15px;
      border: 1px solid #666;
    }

    .sidebar h3 {
      margin-top: 0;
      border-bottom: 1px solid #444;
      padding-bottom: 5px;
    }

    .sidebar a {
      display: block;
      color: #66b3ff;
      margin: 10px 0;
      text-decoration: underline;
      cursor: pointer;
      font-size: 16px;
    }

    .sidebar a:hover {
      color: #ffffff;
      background-color: rgba(255, 255, 255, 0.1);
    }

    .sidebar a.offline-locked {
      color: #cc6666;
    }

    .sidebar a.offline-ok {
      color: #72ff72;
    }

    .add-page-btn {
      color: #72ff72 !important;
      font-weight: bold;
      margin-top: 20px !important;
      border-top: 1px dashed #555;
      padding-top: 15px;
    }

    .content {
      flex: 1;
      background-color: rgba(40, 40, 40, 0.9);
      padding: 20px;
      border: 1px solid #666;
      transition: background-color 0.4s;
      position: relative;
      overflow: hidden;
    }

    .content h2 {
      margin-top: 0;
      border-bottom: 1px dashed #777;
      padding-bottom: 10px;
    }

    #article {
      line-height: 1.5;
    }

    #article::after {
      content: "";
      display: table;
      clear: both;
    }

    #article img {
      max-width: 100%;
      height: auto;
      border: 2px solid #fff;
      margin: 15px 0;
      display: block;
    }

    #article img.wiki-landscape {
      float: right;
      max-width: 45%;
      margin: 5px 0 15px 20px;
    }

    .down-notice {
      background-color: rgba(60, 0, 0, 0.95);
      border: 3px solid #ff3333;
      padding: 18px 20px;
      margin-bottom: 20px;
      text-align: center;
    }
    .down-notice .down-code {
      font-family: monospace;
      font-size: 56px;
      font-weight: bold;
      color: #ff4444;
      margin: 0;
      line-height: 1;
    }
    .down-notice h3 {
      margin: 8px 0 6px 0;
      font-size: 24px;
      letter-spacing: 2px;
      color: white;
    }
    .down-notice p {
      margin: 6px 0;
      color: #ffcccc;
    }
    .down-notice table {
      margin: 14px auto 8px auto;
      border-collapse: collapse;
      font-family: monospace;
      font-size: 14px;
      text-align: left;
      max-width: 100%;
    }
    .down-notice td {
      border: 1px solid #aa3333;
      padding: 5px 10px;
    }
    .down-notice td:first-child {
      color: #ff9999;
    }
    .status-down {
      color: #ff4444;
      font-weight: bold;
    }
    .status-wait {
      color: #ffd24d;
    }
    .status-ok {
      color: #72ff72;
      font-weight: bold;
    }
    .retry-btn {
      margin-top: 10px;
      background: #222;
      color: white;
      border: 2px solid white;
      padding: 8px 18px;
      font-size: 15px;
      font-family: Arial, Helvetica, sans-serif;
      cursor: pointer;
    }
    .retry-btn:hover {
      background: #444;
    }
    .retry-msg {
      font-family: monospace;
      font-size: 13px;
      color: #ffd24d;
      min-height: 18px;
      margin-top: 8px;
    }

    .offline-note {
      background-color: rgba(60, 40, 0, 0.9);
      border: 2px solid #ffd24d;
      padding: 10px 14px;
      margin-bottom: 20px;
      font-family: monospace;
      font-size: 13px;
      color: #ffe9a8;
    }

    .preserved-label {
      font-family: monospace;
      font-size: 12px;
      color: #aaa;
      border-top: 1px dashed #777;
      padding-top: 8px;
      margin-bottom: 12px;
    }

    .empty-page {
      color: #999;
      font-style: italic;
    }

    @media (max-width: 700px) {
      .container { flex-direction: column; }
      .sidebar { width: auto; }
      #article img.wiki-landscape {
        float: none;
        max-width: 100%;
        margin: 15px 0;
      }
      .down-notice .down-code { font-size: 40px; }
      .down-notice h3 { font-size: 18px; }
    }
  </style>
</head>
<body>

<div class="page-wrapper">
  <div class="down-strip">&#9888; SERVICE DOWN &mdash; WIKI OFFLINE DUE TO A SECURITY INCIDENT (PHP EXPLOIT) &#9888;</div>

  <div class="header">
    <h1 id="siteTitle">We The Goobers Wiki</h1>
  </div>

  <div class="container">
    <div class="sidebar" id="sidebar-container">
      <h3>Pages</h3>
      <div id="sidebar-links"><em>Loading pages...</em></div>

      <a href="https://docs.google.com/forms/d/e/1FAIpQLSeKlXZGLQt-3v2KEZXhphRTJLcTFtL0GqD2W7K2SeUVxcnTug/viewform" target="_blank" class="add-page-btn">Add an Entry</a>
    </div>

    <div class="content" id="contentBox">
      <h2 id="pageTitle">Main Page</h2>
      <div id="article"></div>
    </div>
  </div>
</div>

<script>
  const sheetCSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQtwIy6NJ4c_8K6dYpcR_mF0GCC4uvhVXaISv-76QNvNZ7DxcZutJiaDuw2BPQE19xtqG2Cybg87z50/pub?output=csv";

  // The ONLY pages that still work while the site is down (Page IDs)
  const OFFLINE_PAGES = ["toby", "oofer", "pak_attak"];

  function isAvailableOffline(pageId) {
    return OFFLINE_PAGES.includes(String(pageId).trim().toLowerCase());
  }

  let pages = {};
  let currentPageId = null;

  const sidebarLinksDiv = document.getElementById("sidebar-links");
  const articleDiv = document.getElementById("article");
  const pageTitle = document.getElementById("pageTitle");
  const siteTitle = document.getElementById("siteTitle");
  const contentBox = document.getElementById("contentBox");

  const DEFAULT_COLOR = "rgba(40, 40, 40, 0.9)";

  marked.use({ breaks: true, gfm: true });

  function buildDownNotice(pageName) {
    return `
      <div class="down-notice">
        <p class="down-code">503</p>
        <h3>WEBSITE DOWN</h3>
        <p>This wiki has been taken offline after a PHP vulnerability was exploited on the server. (we dont even use PHP)</p>
        <p>The database is being checked and cleaned. Only a few pages are still reachable.</p>
        <table>
          <tr><td>Page</td><td>${pageName}</td></tr>
          <tr><td>Server status</td><td class="status-down">OFFLINE</td></tr>
          <tr><td>Cause</td><td>PHP exploit / unauthorized access</td></tr>
        </table>
        <button class="retry-btn" onclick="retryConnection(this)">Try again</button>
        <div class="retry-msg"></div>
      </div>`;
  }

  function retryConnection(btn) {
    const msg = btn.parentElement.querySelector(".retry-msg");
    btn.disabled = true;
    msg.textContent = "Connecting to server...";
    setTimeout(() => {
      msg.textContent = "Error 503: server is still down. Please try again later.";
      btn.disabled = false;
    }, 1500);
  }

  function fixImages() {
    articleDiv.querySelectorAll("img").forEach(img => {
      const checkImageShape = () => {
        if (img.naturalWidth > img.naturalHeight) {
          img.classList.add("wiki-landscape");
        }
      };
      if (img.complete) {
        checkImageShape();
      } else {
        img.onload = checkImageShape;
      }
    });
  }

  // Main page: just the down notice
  function renderMain() {
    articleDiv.innerHTML =
      buildDownNotice("Main Page") +
      '<p>Only the pages marked in green on the left are available right now.</p>';
  }

  // Blocked page: down notice only, no content
  function renderBlocked(pageName) {
    articleDiv.innerHTML =
      buildDownNotice(pageName) +
      '<p class="empty-page">This page is unavailable while the site is down.</p>';
  }

  // Allowed page: real content
  function renderAllowed(pageName, markdownContent) {
    const hasContent = markdownContent && markdownContent.trim() !== "";
    const body = hasContent
      ? marked.parse(markdownContent)
      : '<p class="empty-page">This page has no content yet.</p>';

    articleDiv.innerHTML =
      '<div class="offline-note">&#9888; The site is down. This page is one of the few still available offline.</div>' +
      body;
    fixImages();
  }

  renderMain();

  Papa.parse(sheetCSV, {
    download: true,
    header: true,
    complete: function(results) {
      const data = results.data;
      sidebarLinksDiv.innerHTML = "";

      data.forEach(row => {
        if (!row["Page ID"]) return;

        const id = row["Page ID"];
        pages[id] = {
          title: row["Title"],
          content: row["Content"],
          banner: row["Banner URL"],
          color: row["Color"] || DEFAULT_COLOR
        };

        const link = document.createElement("a");
        link.textContent = row["Title"];
        link.className = isAvailableOffline(id) ? "offline-ok" : "offline-locked";
        link.onclick = () => loadPage(id);
        sidebarLinksDiv.appendChild(link);
      });
    },
    error: function(err) {
      sidebarLinksDiv.innerHTML = "Failed to load database.";
    }
  });

  function loadPage(key) {
    currentPageId = key;
    const page = pages[key];

    pageTitle.textContent = page.title;
    siteTitle.textContent = "We The Goobers Wiki - " + page.title;

    if (isAvailableOffline(key)) {
      if (page.banner && page.banner.toLowerCase() !== "none") {
        document.body.style.backgroundImage = `url("${page.banner}")`;
      } else {
        document.body.style.backgroundImage = `none`;
      }
      contentBox.style.backgroundColor = page.color;
      renderAllowed(page.title, page.content);
    } else {
      document.body.style.backgroundImage = `none`;
      contentBox.style.backgroundColor = DEFAULT_COLOR;
      renderBlocked(page.title);
    }
  }
</script>

</body>
</html>
