<!DOCTYPE html>
<html>
<head>
  <title>We The Goobers Wiki</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- This tiny script allows us to easily read Google Sheets -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    /* Basic, classic web typography */
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      background-color: #111;
      background-size: cover;
      background-position: center;
      background-attachment: fixed; 
      transition: background-image 0.5s ease-in-out; 
    }

    .page-wrapper {
      background-color: rgba(0, 0, 0, 0.75);
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    .header {
      text-align: center;
      padding: 20px 0;
      border-bottom: 2px solid #555;
      margin-bottom: 20px;
      max-width: 1000px;
      margin: 0 auto 20px auto;
    }

    .header h1 {
      margin: 0;
      font-size: 36px;
    }

    .container {
      display: flex;
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto; 
    }

    .sidebar {
      width: 200px;
      background-color: rgba(30, 30, 30, 0.9);
      padding: 15px;
      border: 1px solid #666;
    }

    .sidebar h3 {
      margin-top: 0;
      border-bottom: 1px solid #444;
      padding-bottom: 5px;
    }

    .sidebar a {
      display: block;
      color: #66b3ff;
      margin: 10px 0;
      text-decoration: underline; 
      cursor: pointer;
      font-size: 16px;
    }

    .sidebar a:hover {
      color: #ffffff;
      background-color: rgba(255, 255, 255, 0.1);
    }

    /* The Add Page Button */
    .add-page-btn {
      color: #72ff72 !important;
      font-weight: bold;
      margin-top: 20px !important;
      border-top: 1px dashed #555;
      padding-top: 15px;
    }

    .content {
      flex: 1;
      background-color: rgba(40, 40, 40, 0.9);
      padding: 20px;
      border: 1px solid #666;
      transition: background-color 0.4s; 
    }

    .content h2 {
      margin-top: 0;
      border-bottom: 1px dashed #777;
      padding-bottom: 10px;
    }

    #article {
      line-height: 1.5;
    }

    #article::after {
      content: "";
      display: table;
      clear: both;
    }

    #article img {
      max-width: 100%;
      height: auto;
      border: 2px solid #fff; 
      margin: 15px 0;
      display: block;
    }

    #article img.wiki-landscape {
      float: right;
      max-width: 45%; 
      margin: 5px 0 15px 20px; 
    }

    @media (max-width: 700px) {
      .container { flex-direction: column; }
      .sidebar { width: auto; }
      #article img.wiki-landscape {
        float: none;
        max-width: 100%;
        margin: 15px 0;
      }
    }
  </style>
</head>
<body>

<div class="page-wrapper">
  <div class="header">
    <h1 id="siteTitle">We The Goobers Wiki</h1>
  </div>

  <div class="container">
    <div class="sidebar">
      <h3>Pages</h3>
      <!-- Links will be injected here automatically from Google Sheets -->
      <div id="sidebar-links"><em>Loading pages...</em></div>
      
      <!-- Link this directly to your Google Form URL -->
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSeKlXZGLQt-3v2KEZXhphRTJLcTFtL0GqD2W7K2SeUVxcnTug/viewform" target="_blank" class="add-page-btn">Add an Entry</a>
    </div>
    
    <div class="content" id="contentBox">
      <h2 id="pageTitle">Main Page</h2>
      <div id="article">Welcome to the wiki. Give it a second to load the database!</div>
    </div>
  </div>
</div>

<script>
  // 1. Paste your published CSV link here!
  const sheetCSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQtwIy6NJ4c_8K6dYpcR_mF0GCC4uvhVXaISv-76QNvNZ7DxcZutJiaDuw2BPQE19xtqG2Cybg87z50/pub?output=csv";
  
  // This will store our pages once they load from the sheet
  let pages = {};

  const sidebarLinksDiv = document.getElementById("sidebar-links");
  const articleDiv = document.getElementById("article");
  const pageTitle = document.getElementById("pageTitle");
  const siteTitle = document.getElementById("siteTitle");
  const contentBox = document.getElementById("contentBox");

  // 2. Fetch the data from Google Sheets using PapaParse
  Papa.parse(sheetCSV, {
    download: true,
    header: true, // Tells it to use the first row (your question titles) as labels
    complete: function(results) {
      const data = results.data;
      sidebarLinksDiv.innerHTML = ""; // Clear the "loading" text

      // Loop through every row in the Google Sheet
      data.forEach(row => {
        // Skip empty rows
        if (!row["Page ID"]) return; 
        
        // Save the row data into our pages object
        // Make sure these match the exact column names in your Google Sheet!
        pages[row["Page ID"]] = {
          title: row["Title"],
          content: row["Content"],
          banner: row["Banner URL"],
          color: row["Color"] || "rgba(40, 40, 40, 0.9)" // Default color if they leave it blank
        };

        // Create the clickable link in the sidebar
        const link = document.createElement("a");
        link.textContent = row["Title"];
        link.onclick = () => loadPage(row["Page ID"]);
        sidebarLinksDiv.appendChild(link);
      });

      // Load a default welcome message once data is ready
      articleDiv.innerHTML = "Database connected! Click a page on the left.";
    },
    error: function(err) {
      sidebarLinksDiv.innerHTML = "Failed to load database.";
    }
  });

  // 3. Load the page when a link is clicked
  function loadPage(key) {
    const page = pages[key];

    // Banner logic
    if (page.banner && page.banner.toLowerCase() !== "none") {
      document.body.style.backgroundImage = `url("${page.banner}")`;
    } else {
      document.body.style.backgroundImage = `none`;
    }

    // Color logic
    contentBox.style.backgroundColor = page.color;
    
    // Titles
    pageTitle.textContent = page.title;
    siteTitle.textContent = "We The Goobers Wiki - " + page.title;
    
    // Formatting the text content
    // Converts text from the Google sheet into paragraphs
    const formattedText = page.content.split('\n\n').map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');
    articleDiv.innerHTML = formattedText;

    // Apply Wikipedia landscape image styling
    const images = articleDiv.querySelectorAll("img");
    images.forEach(img => {
      const checkImageShape = () => {
        if (img.naturalWidth > img.naturalHeight) {
          img.classList.add("wiki-landscape");
        }
      };
      if (img.complete) {
        checkImageShape();
      } else {
        img.onload = checkImageShape;
      }
    });
  }
</script>

</body>
</html>
