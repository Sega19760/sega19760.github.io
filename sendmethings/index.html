<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Studio</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --surface: #1e293b;
            --surface-hover: #334155;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #10b981;
            --danger: #ef4444;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .app-wrapper {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
            max-width: 800px;
            width: 100%;
            align-items: start;
        }

        @media (min-width: 768px) {
            .app-wrapper {
                grid-template-columns: 1fr 1fr;
            }
        }

        .card {
            background: var(--surface);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            border: 1px solid var(--border);
        }

        .header {
            margin-bottom: 24px;
        }

        h2 { 
            margin: 0 0 8px 0; 
            font-weight: 600;
            font-size: 24px;
            letter-spacing: -0.5px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.05);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
        }

        .status-dot.connected { background: var(--success); box-shadow: 0 0 8px var(--success); }
        .status-dot.error { background: var(--danger); box-shadow: 0 0 8px var(--danger); }

        .control-group {
            margin-bottom: 16px;
        }

        label { 
            display: block;
            font-size: 13px; 
            color: var(--text-muted); 
            margin-bottom: 8px; 
            font-weight: 500;
        }

        .color-pickers {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .color-picker-wrapper {
            position: relative;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: border-color 0.2s;
        }
        
        .color-picker-wrapper:hover {
            border-color: var(--primary);
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            padding: 0;
            background: none;
        }
        
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 6px; }

        .color-label {
            font-size: 14px;
            font-weight: 500;
        }

        select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: rgba(0,0,0,0.2);
            color: var(--text-main);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2394a3b8%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat, repeat;
            background-position: right 14px top 50%, 0 0;
            background-size: 10px auto, 100%;
            transition: border-color 0.2s;
        }

        select:focus { border-color: var(--primary); }

        textarea { 
            width: 100%; 
            height: 100px;
            padding: 14px; 
            border-radius: 10px; 
            border: 1px solid var(--border); 
            background: rgba(0,0,0,0.2);
            color: var(--text-main);
            font-family: inherit;
            font-size: 15px; 
            resize: none;
            box-sizing: border-box;
            outline: none;
            transition: all 0.2s;
        }

        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        
        button { 
            width: 100%;
            padding: 14px; 
            background: linear-gradient(135deg, var(--primary), #6366f1);
            color: white; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: 15px; 
            font-weight: 600; 
            margin-top: 8px;
            transition: transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        button:active { transform: scale(0.98); }
        button:hover { box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4); }

        /* Log Styling */
        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .log-title { font-weight: 600; font-size: 16px; }
        
        #messageLog {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 4px;
        }

        /* Custom Scrollbar */
        #messageLog::-webkit-scrollbar { width: 6px; }
        #messageLog::-webkit-scrollbar-track { background: transparent; }
        #messageLog::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

        .log-entry {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            animation: slideIn 0.3s ease-out forwards;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .log-meta {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .preview-box {
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            word-wrap: break-word;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .empty-state {
            text-align: center;
            padding: 40px 0;
            color: var(--text-muted);
            font-style: italic;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        
        <div class="card">
            <div class="header">
                <h2>ESP32 Studio</h2>
                <div class="status-badge" id="statusBadge">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">Connecting...</span>
                </div>
            </div>
            
            <div class="control-group color-pickers">
                <div>
                    <label>Text Color</label>
                    <div class="color-picker-wrapper">
                        <input type="color" id="tc" value="#00FFFF">
                        <span class="color-label">Text</span>
                    </div>
                </div>
                <div>
                    <label>Background</label>
                    <div class="color-picker-wrapper">
                        <input type="color" id="bc" value="#000000">
                        <span class="color-label">Back</span>
                    </div>
                </div>
            </div>

            <div class="control-group">
                <label>Typography</label>
                <select id="fontSelect">
                    <option value="2">Small (Standard)</option>
                    <option value="4" selected>Medium (Bold / Thick)</option>
                    <option value="6">Large (Display)</option>
                </select>
            </div>

            <div class="control-group" style="margin-bottom: 0;">
                <label>Message Payload</label>
                <textarea id="messageBox" placeholder="What do you want to show on the screen?"></textarea>
            </div>
            
            <button onclick="sendMessage()" id="sendBtn">Push to Screen</button>
        </div>

        
        <div class="card">
            <div class="log-header">
                <span class="log-title">Broadcast History</span>
            </div>
            <div id="messageLog">
                <div class="empty-state" id="emptyState">
                    Waiting for your first broadcast...
                </div>
            </div>
        </div>
    </div>

    <script>
        const brokerUrl = "wss://broker.emqx.io:8084/mqtt";
        const client = mqtt.connect(brokerUrl);

        // MUST MATCH THE ESP32 EXACTLY
        const mqttTopic = "benluc/my_secret_room_77492/display"; 

        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');
        const statusBadge = document.getElementById('statusBadge');

        client.on('connect', function () {
            statusText.innerText = "Cloud Connected";
            statusDot.className = "status-dot connected";
        });

        client.on('error', function (err) {
            statusText.innerText = "Connection Failed";
            statusDot.className = "status-dot error";
        });

        function sendMessage() {
            const msg = document.getElementById('messageBox').value;
            if (msg.trim() === "") return;

            const tc = document.getElementById('tc').value;
            const bc = document.getElementById('bc').value;
            const font = document.getElementById('fontSelect').value;

            // Package it for ESP32
            const payload = tc + "," + bc + "," + font + "," + msg;

            client.publish(mqttTopic, payload);
            addToLog(msg, tc, bc, font);

            // Reset input and show success state
            document.getElementById('messageBox').value = "";
            const originalText = statusText.innerText;
            
            statusText.innerText = "Message Delivered!";
            statusBadge.style.borderColor = "var(--success)";
            
            setTimeout(() => {
                statusText.innerText = "Cloud Connected";
                statusBadge.style.borderColor = "var(--border)";
            }, 2500);
        }

        function addToLog(msgText, textColor, bgColor, fontVal) {
            const logDiv = document.getElementById('messageLog');
            const emptyState = document.getElementById('emptyState');
            
            if(emptyState) {
                emptyState.remove();
            }

            const timeString = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            let fontLabel = "Small";
            if(fontVal === "4") fontLabel = "Medium Bold";
            if(fontVal === "6") fontLabel = "Large";

            const entryHTML = `
                <div class="log-entry">
                    <div class="log-meta">
                        <span>${timeString}</span>
                        <span>${fontLabel}</span>
                    </div>
                    <div class="preview-box" style="background-color: \({bgColor}; color:\){textColor};">
                        ${msgText.replace(/\n/g, '<br>')}
                    </div>
                </div>
            `;
            
            // Insert at top
            logDiv.insertAdjacentHTML('afterbegin', entryHTML);
        }
    </script>
</body>
</html>
