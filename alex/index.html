    <div id="center">
      <div class="dog" id="dog_sleep">
        <img alt="Sleeping dog" class="dog1" src="https://i.imgur.com/FiaVZZ7.gif">
      </div>
    </div>
    
    <style>  
      .dog {    
        min-width: 320px;    
        max-width: 100%;    
        min-height: 320px;    
        max-height: 100%;    
        position: relative;    
        color: black;    
        cursor: pointer;  
      }  
      .dog img {    
        position: absolute;    
        height: 100%;    
        width: 100%;    
        object-fit: contain;    
        image-rendering: pixelated;  
      }  
    </style>
    
    <script>  
      var results = new Howl({    
        src: ['https://deltarune.com/assets/audio/results.ogg'],    
        volume: 0.5,    
        loop: true  
      });

      // Function to freeze a GIF by drawing it to a canvas and extracting the first frame as a static image
      function freezeGif(imgElement, callback) {
        var c = document.createElement('canvas');
        var w = c.width = imgElement.naturalWidth || imgElement.width || 320;
        var h = c.height = imgElement.naturalHeight || imgElement.height || 320;
        var ctx = c.getContext('2d');
        
        // Draw the current state (first frame) of the image onto the canvas
        ctx.drawImage(imgElement, 0, 0, w, h);
        
        // Replace the image source with the canvas data URL (freezing it)
        var staticDataUrl = c.toDataURL();
        imgElement.dataset.staticSrc = staticDataUrl;
        imgElement.dataset.animatedSrc = imgElement.src;
        
        // Start frozen
        imgElement.src = staticDataUrl;
        if (callback) callback();
      }

      $(function() {    
        var img = $('#dog_sleep img')[0];
        if (img.complete) {
          freezeGif(img);
        } else {
          $(img).on('load', function() {
            freezeGif(this);
          });
        }
      });    

      $(document).on('click', '.dog:not(.playing)', function() {    
        results.play();
        var img = $(this).find('img')[0];
        if (img.dataset.animatedSrc) {
          img.src = img.dataset.animatedSrc; // Switch back to animated GIF
        }    
        $(this).addClass('playing');    
      });    

      $(document).on('click', '.dog.playing', function() {    
        results.pause();
        var img = $(this).find('img')[0];
        if (img.dataset.staticSrc) {
          img.src = img.dataset.staticSrc; // Switch back to frozen frame canvas image
        }    
        $(this).removeClass('playing');    
      });
    </script>
