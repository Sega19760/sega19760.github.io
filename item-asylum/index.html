<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Asylum - Loading Screen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #153f61;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        /* Faithful Item Asylum / Roblox RobotoMono splash text styling */
        .ia-splash-text {
            font-family: 'Roboto Mono', 'Courier New', monospace;
            font-weight: 400;
            font-size: 16.5px;
            color: #ffffff;
            letter-spacing: 0.04em;
            line-height: 1.35;
            margin: 0;
            text-shadow:
                0px 1px 2px rgba(0, 0, 0, 0.65),
                -1px -1px 0 rgba(9, 26, 42, 0.75),
                 1px -1px 0 rgba(9, 26, 42, 0.75),
                -1px  1px 0 rgba(9, 26, 42, 0.75),
                 1px  1px 0 rgba(9, 26, 42, 0.75);
        }

        /* Continuous slow clockwise spin (~40 deg/s = 9s per full turn) */
        @keyframes spinSlow {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .spinning-guy {
            width: 31px;
            height: 31px;
            animation: spinSlow 9s linear infinite;
            will-change: transform;
        }
    </style>
</head>
<body class="relative w-screen h-screen overflow-hidden cursor-pointer" title="Click or press Spacebar for a new tip">

    <!-- 1. Background Repeating IA Tile Canvas (Moves at 30 px/s) -->
    <canvas id="patternCanvas" class="block w-full h-full"></canvas>

    <!-- 2. Faithful Original Loading Screen Centerpiece Layout -->
    <main class="pointer-events-none fixed inset-0 z-10 flex flex-col items-center justify-center" style="padding-bottom: 1.5vh;">
        
        <!-- Direct Transparent PNG "IA" Emblem -->
        <img 
            src="image_629798.png" 
            alt="IA" 
            class="block w-[138px] h-auto select-none"
            draggable="false"
        />

        <!-- Flavour Text (24px below emblem, 42px above spinning :> guy) -->
        <div class="w-[92vw] max-w-[1200px] text-center px-4" style="margin-top: 24px; margin-bottom: 42px;">
            <p id="flavorTextDisplay" class="ia-splash-text">
                Item Asylum was originally going to be called 'Jean's Randomizer'!
            </p>
        </div>

        <!-- Slowly Spinning ":>" Square Guy -->
        <div class="spinning-guy">
            <svg viewBox="0 0 32 32" class="w-full h-full block overflow-visible" shape-rendering="geometricPrecision">
                <!-- Sharp dark navy border and medium-dark slate blue fill -->
                <rect x="0.8" y="0.8" width="30.4" height="30.4" fill="#1e4d74" stroke="#0b2033" stroke-width="1.6" />
                <!-- Top dot of ':' -->
                <rect x="8.2" y="10.2" width="2.4" height="2.4" rx="0.4" fill="#8ad2ff" />
                <!-- Bottom dot of ':' -->
                <rect x="8.2" y="18.8" width="2.4" height="2.4" rx="0.4" fill="#8ad2ff" />
                <!-- Crisp '>' chevron -->
                <polyline 
                    points="14.5,10.2 22.8,15.7 14.5,21.2" 
                    fill="none" 
                    stroke="#8ad2ff" 
                    stroke-width="2.1" 
                    stroke-linecap="square" 
                    stroke-linejoin="miter" 
                />
            </svg>
        </div>

    </main>

            // =========================================================================
            // 2. FAITHFUL ITEM ASYLUM BACKGROUND TILE ENGINE (30 PX/S)
            // =========================================================================
            const canvas = document.getElementById('patternCanvas');
            const ctx = canvas.getContext('2d');

            // Exact colors & scale sampled from image_630052.png
            const TILE_SIZE = 228;
            const MOVE_SPEED = 30; // Exactly 30 pixels per second
            const BG_COLOR = '#153f61';
            const BORDER_COLOR = '#204b6e';
            const SHAPE_COLOR = '#1d486a';

            let offsetX = 0;

            const tileCanvas = document.createElement('canvas');
            const tileCtx = tileCanvas.getContext('2d');

            function buildSingleTile() {
                const dpr = window.devicePixelRatio || 1;
                tileCanvas.width = TILE_SIZE * dpr;
                tileCanvas.height = TILE_SIZE * dpr;

                tileCtx.save();
                tileCtx.scale(dpr, dpr);

                const s = TILE_SIZE / 200;
                tileCtx.scale(s, s);

                // 1. Base tile background fill (#153f61)
                tileCtx.fillStyle = BG_COLOR;
                tileCtx.fillRect(0, 0, 200, 200);

                // 2. Outer grid line & inner square frame (#204b6e) with #153f61 gap between them
                tileCtx.strokeStyle = BORDER_COLOR;
                tileCtx.lineWidth = 2.2;
                tileCtx.strokeRect(0, 0, 200, 200);

                tileCtx.lineWidth = 3.0;
                tileCtx.strokeRect(8.5, 8.5, 183, 183);

                // 3. Geometric "IA" silhouette inside tile (#1d486a)
                tileCtx.fillStyle = SHAPE_COLOR;

                // Left tilted trapezoid 'I'
                tileCtx.beginPath();
                tileCtx.moveTo(23, 33);
                tileCtx.lineTo(54, 30);
                tileCtx.lineTo(79, 173);
                tileCtx.lineTo(26, 177);
                tileCtx.closePath();
                tileCtx.fill();

                // Right blocky 'A'
                tileCtx.beginPath();
                tileCtx.moveTo(117, 79);
                tileCtx.lineTo(154, 79);
                tileCtx.lineTo(183, 173);
                tileCtx.lineTo(143, 178);
                tileCtx.lineTo(140, 165);
                tileCtx.lineTo(127, 165);
                tileCtx.lineTo(124, 178);
                tileCtx.lineTo(83, 172);
                tileCtx.closePath();

                // Inner triangular cutout of 'A'
                tileCtx.moveTo(135, 108);
                tileCtx.lineTo(124, 134);
                tileCtx.lineTo(145, 134);
                tileCtx.closePath();

                tileCtx.fill('evenodd');
                tileCtx.restore();
            }

            function resizeCanvas() {
                const dpr = window.devicePixelRatio || 1;
                canvas.width = window.innerWidth * dpr;
                canvas.height = window.innerHeight * dpr;
                buildSingleTile();
            }

            let lastTime = performance.now();
            function animate(now) {
                const dt = (now - lastTime) / 1000;
                lastTime = now;

                // Scroll smoothly at 30 px per second
                offsetX -= MOVE_SPEED * dt;

                const wrappedX = ((offsetX % TILE_SIZE) + TILE_SIZE) % TILE_SIZE;
                // Align vertical tile grid with the screenshot
                const fixedY = -58;
                const wrappedY = ((fixedY % TILE_SIZE) + TILE_SIZE) % TILE_SIZE;

                const dpr = window.devicePixelRatio || 1;
                ctx.save();
                ctx.scale(dpr, dpr);

                const viewW = window.innerWidth;
                const viewH = window.innerHeight;

                for (let x = wrappedX - TILE_SIZE; x < viewW + TILE_SIZE; x += TILE_SIZE) {
                    for (let y = wrappedY - TILE_SIZE; y < viewH + TILE_SIZE; y += TILE_SIZE) {
                        ctx.drawImage(
                            tileCanvas,
                            0, 0, tileCanvas.width, tileCanvas.height,
                            x, y, TILE_SIZE + 0.5, TILE_SIZE + 0.5
                        );
                    }
                }

                ctx.restore();
                requestAnimationFrame(animate);
            }

            // =========================================================================
            // 3. FLAVOUR TEXT CYCLING (Click, Keys, & Auto-Cycle Every 8s)
            // =========================================================================
            const flavorTextDisplay = document.getElementById('flavorTextDisplay');
            let currentIndex = FLAVOR_TEXTS.indexOf("Item Asylum was originally going to be called 'Jean's Randomizer'!");
            if (currentIndex === -1) currentIndex = 0;

            let autoCycleTimer = null;

            function resetAutoCycle() {
                if (autoCycleTimer) clearInterval(autoCycleTimer);
                autoCycleTimer = setInterval(showRandomTip, 8000);
            }

            function showRandomTip() {
                let nextIndex;
                do {
                    nextIndex = Math.floor(Math.random() * FLAVOR_TEXTS.length);
                } while (nextIndex === currentIndex && FLAVOR_TEXTS.length > 1);
                currentIndex = nextIndex;
                flavorTextDisplay.textContent = FLAVOR_TEXTS[currentIndex];
            }

            function showAdjacentTip(step) {
                currentIndex = (currentIndex + step + FLAVOR_TEXTS.length) % FLAVOR_TEXTS.length;
                flavorTextDisplay.textContent = FLAVOR_TEXTS[currentIndex];
            }

            // Click anywhere or press Spacebar / Arrow keys to change flavour text
            window.addEventListener('click', () => {
                showRandomTip();
                resetAutoCycle();
            });

            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space') {
                    e.preventDefault();
                    showRandomTip();
                    resetAutoCycle();
                } else if (e.code === 'ArrowRight' || e.code === 'ArrowDown') {
                    showAdjacentTip(1);
                    resetAutoCycle();
                } else if (e.code === 'ArrowLeft' || e.code === 'ArrowUp') {
                    showAdjacentTip(-1);
                    resetAutoCycle();
                }
            });

            window.addEventListener('resize', resizeCanvas);
            window.onload = function() {
                resizeCanvas();
                resetAutoCycle();
                requestAnimationFrame(animate);
            };
        })();
    </script>
</body>
</html>
