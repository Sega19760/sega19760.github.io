<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .controller-panel {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            width: 350px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-top: 0;
            margin-bottom: 25px;
        }
        .slider-container {
            margin-bottom: 25px;
        }
        .slider-label {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-bottom: 8px;
            color: #555;
        }
        .slider {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            height: 10px;
            border-radius: 5px;
            background: #ddd;
            outline: none;
        }
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #4CAF50;
            cursor: pointer;
            transition: background 0.15s;
        }
        .slider::-webkit-slider-thumb:hover {
            background: #45a049;
        }
        .slider::-webkit-slider-thumb:active {
            background: #3e8e41;
        }
    </style>
</head>
<body>

    <div class="controller-panel">
        <h2>Robot Arm Control</h2>

        <div class="slider-container">
            <div class="slider-label">
                <span>Base</span>
                <span id="base_val">90°</span>
            </div>
            <!-- oninput updates the text, onchange sends the server request when released -->
            <input type="range" min="0" max="180" value="90" class="slider" id="base" 
                   oninput="updateLabel('base', this.value)" 
                   onchange="sendMove('base', this.value)">
        </div>

        <div class="slider-container">
            <div class="slider-label">
                <span>Shoulder</span>
                <span id="shoulder_val">90°</span>
            </div>
            <input type="range" min="0" max="180" value="90" class="slider" id="shoulder" 
                   oninput="updateLabel('shoulder', this.value)" 
                   onchange="sendMove('shoulder', this.value)">
        </div>

        <div class="slider-container">
            <div class="slider-label">
                <span>Elbow</span>
                <span id="elbow_val">90°</span>
            </div>
            <input type="range" min="0" max="180" value="90" class="slider" id="elbow" 
                   oninput="updateLabel('elbow', this.value)" 
                   onchange="sendMove('elbow', this.value)">
        </div>

        <div class="slider-container">
            <div class="slider-label">
                <span>Gripper</span>
                <span id="gripper_val">0%</span>
            </div>
            <input type="range" min="0" max="100" value="0" class="slider" id="gripper" 
                   oninput="updateLabel('gripper', this.value)" 
                   onchange="sendMove('gripper', this.value)">
        </div>
    </div>

    <script>
        const NGROK_URL = "https://margarita-evacuee-reprint.ngrok-free.dev/move";

        // 1. Only updates the text on the screen while you drag
        function updateLabel(joint, value) {
            const unit = joint === 'gripper' ? '%' : '°';
            document.getElementById(joint + '_val').innerText = value + unit;
        }

        // 2. Only fires when you let go of the mouse/slider
        function sendMove(joint, value) {
            const targetUrl = `${NGROK_URL}?joint=${joint}&angle=${value}`;
            
            fetch(targetUrl, {
                headers: { "ngrok-skip-browser-warning": "69420" } 
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Server returned ${response.status}`);
                }
                return response.json();
            })
            .then(data => console.log(`Success: ${joint} moved to ${value}`, data))
            .catch(error => console.error("Error connecting to robot:", error));
        }
    </script>
</body>
</html>
