<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .controller-panel {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            width: 350px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-top: 0;
            margin-bottom: 25px;
        }
        .slider-container {
            margin-bottom: 25px;
        }
        .slider-label {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-bottom: 8px;
            color: #555;
        }
        .slider {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            height: 10px;
            border-radius: 5px;
            background: #ddd;
            outline: none;
        }
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #4CAF50;
            cursor: pointer;
            transition: background 0.15s;
        }
        .slider::-webkit-slider-thumb:hover {
            background: #45a049;
        }
        .slider::-webkit-slider-thumb:active {
            background: #3e8e41;
        }
    </style>
</head>
<body>

    <div class="controller-panel">
        <h2>Robot Arm Control</h2>

        <div class="slider-container">
            <div class="slider-label">
                <span>Base</span>
                <span id="base_val">90°</span>
            </div>
            <input type="range" min="0" max="180" value="90" class="slider" id="base" oninput="updateArm('base', this.value)">
        </div>

        <div class="slider-container">
            <div class="slider-label">
                <span>Shoulder</span>
                <span id="shoulder_val">90°</span>
            </div>
            <input type="range" min="0" max="180" value="90" class="slider" id="shoulder" oninput="updateArm('shoulder', this.value)">
        </div>

        <div class="slider-container">
            <div class="slider-label">
                <span>Elbow</span>
                <span id="elbow_val">90°</span>
            </div>
            <input type="range" min="0" max="180" value="90" class="slider" id="elbow" oninput="updateArm('elbow', this.value)">
        </div>

        <div class="slider-container">
            <div class="slider-label">
                <span>Gripper</span>
                <span id="gripper_val">0%</span>
            </div>
            <input type="range" min="0" max="100" value="0" class="slider" id="gripper" oninput="updateArm('gripper', this.value)">
        </div>
    </div>

    <script>
        // Note: Removed "?action=" from the end so we can build a new query string
        const NGROK_URL = "https://margarita-evacuee-reprint.ngrok-free.dev/move";
        
        // Timer used to prevent network spam
        let debounceTimer = null;

        function updateArm(joint, value) {
            // 1. Update the text on the screen immediately so it feels responsive
            const unit = joint === 'gripper' ? '%' : '°';
            document.getElementById(joint + '_val').innerText = value + unit;

            // 2. Clear the previous timer if the user is still dragging the slider
            clearTimeout(debounceTimer);
            
            // 3. Wait 100ms after they stop dragging before sending the fetch request
            debounceTimer = setTimeout(() => {
                
                // Formats the URL like: /move?joint=base&angle=90
                const targetUrl = `${NGROK_URL}?joint=${joint}&angle=${value}`;
                
                fetch(targetUrl, {
                    headers: { "ngrok-skip-browser-warning": "69420" } 
                })
                .then(response => response.json())
                .then(data => console.log(`Success: ${joint} moved to ${value}`, data))
                .catch(error => console.error("Error connecting to robot:", error));
                
            }, 100); // 100 milliseconds delay
        }
    </script>
</body>
</html>
